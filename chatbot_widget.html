<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockPulse AI — Chatbot</title>
  <style>
    /* ==============================
       Reset & Variáveis do Design
    ============================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark:    #0a0d0a;
      --bg-panel:   #111611;
      --bg-card:    #161d16;
      --bg-input:   #1a221a;
      --border:     #1f2d1f;
      --green:      #39ff6a;
      --green-dim:  #2acc55;
      --green-glow: rgba(57, 255, 106, 0.15);
      --text-main:  #e8f5e8;
      --text-muted: #6b8a6b;
      --text-dim:   #3d5c3d;
      --danger:     #ff4444;
      --warn:       #ffb347;
      --radius:     12px;
      --radius-sm:  8px;
      --shadow:     0 4px 24px rgba(0,0,0,0.6);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ==============================
       Layout Principal
    ============================== */
    .chat-wrapper {
      width: 100%;
      max-width: 520px;
      height: calc(100vh - 32px);
      max-height: 820px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow), 0 0 60px rgba(57,255,106,0.05);
      overflow: hidden;
    }

    /* ==============================
       Header
    ============================== */
    .chat-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-info { flex: 1; }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.3px;
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ==============================
       Área de Mensagens
    ============================== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Mensagens */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user  { align-self: flex-end; align-items: flex-end; }
    .msg.bot   { align-self: flex-start; align-items: flex-start; }
    .msg.system { align-self: center; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user  .msg-bubble {
      background: var(--green);
      color: #0a0d0a;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .msg.system .msg-bubble {
      background: transparent;
      border: 1px dashed var(--text-dim);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Markdown-like dentro das bolhas */
    .msg-bubble strong { color: var(--green); }
    .msg.user .msg-bubble strong { color: #000; }
    .msg-bubble em { color: var(--text-muted); font-style: italic; }

    /* Intent badge */
    .intent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text-dim);
      padding: 2px 8px;
      border: 1px solid var(--text-dim);
      border-radius: 20px;
      margin-bottom: 4px;
    }

    /* ==============================
       Sugestões
    ============================== */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .suggestion-btn {
      background: transparent;
      border: 1px solid var(--green-dim);
      color: var(--green-dim);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .suggestion-btn:hover {
      background: var(--green-glow);
      color: var(--green);
      border-color: var(--green);
    }

    /* ==============================
       Typing indicator
    ============================== */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--green-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ==============================
       Config Panel (token)
    ============================== */
    .config-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin: 0 16px;
      flex-shrink: 0;
    }

    .config-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .config-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .config-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12px;
      padding: 6px 10px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    .config-input:focus { border-color: var(--green-dim); }

    .config-save-btn {
      background: var(--green-glow);
      border: 1px solid var(--green-dim);
      color: var(--green);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.2s;
    }

    .config-save-btn:hover { background: var(--green); color: #000; }

    /* ==============================
       Input Area
    ============================== */
    .chat-input-area {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      background: var(--bg-card);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .msg-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 14px;
      padding: 10px 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    .msg-input::placeholder { color: var(--text-dim); }
    .msg-input:focus { border-color: var(--green-dim); }

    .send-btn {
      width: 42px;
      height: 42px;
      background: var(--green);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: #4dff80; transform: scale(1.05); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { background: var(--text-dim); cursor: not-allowed; transform: none; }

    .send-btn svg { width: 18px; height: 18px; fill: #0a0d0a; }

    .input-hint {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 6px;
    }

    /* ==============================
       Responsive
    ============================== */
    @media (max-width: 540px) {
      body { padding: 0; }
      .chat-wrapper { max-height: 100vh; height: 100vh; border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

<div class="chat-wrapper">
  <!-- Header -->
  <div class="chat-header">
    <div class="logo-mark">🌿</div>
    <div class="header-info">
      <div class="header-title">StockPulse AI</div>
      <div class="header-subtitle">Assistente de gestão · CMV, Estoque, Vendas</div>
    </div>
    <div class="status-dot" id="statusDot" title="Online"></div>
  </div>

  <!-- Área de mensagens -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- Config: token de autenticação -->
  <div class="config-panel" id="configPanel">
    <div class="config-label">🔑 Token de acesso (Bearer)</div>
    <div class="config-row">
      <input
        type="password"
        class="config-input"
        id="tokenInput"
        placeholder="Cole seu access_token aqui..."
        autocomplete="off"
      />
      <button class="config-save-btn" onclick="salvarToken()">Salvar</button>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="input-row">
      <textarea
        class="msg-input"
        id="msgInput"
        placeholder="Pergunte sobre CMV, estoque, vendas..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="enviarMensagem()" title="Enviar">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter para enviar · Shift+Enter para nova linha</div>
  </div>
</div>

<script>
  // ============================================================
  // Configuração
  // ============================================================
  const API_BASE = 'http://localhost:8000';  // Ajuste para sua URL de produção
  let accessToken = localStorage.getItem('sp_token') || '';
  let historico = [];
  let enviando = false;

  // ============================================================
  // Inicialização
  // ============================================================
  window.addEventListener('load', () => {
    if (accessToken) {
      document.getElementById('tokenInput').value = '••••••••••';
      document.getElementById('configPanel').style.display = 'none';
    }
    addBotMessage(
      '👋 Olá! Sou o **StockPulse AI**, seu assistente de gestão.\n\n' +
      'Posso te ajudar com CMV, estoque, compras, vendas e perdas.\n\n' +
      'O que você gostaria de saber?',
      ['Qual meu CMV este mês?', 'Quais produtos estão com estoque baixo?', 'Quanto vendi ontem?']
    );
    document.getElementById('msgInput').focus();
  });

  // ============================================================
  // Token
  // ============================================================
  function salvarToken() {
    const val = document.getElementById('tokenInput').value.trim();
    if (!val || val === '••••••••••') return;
    accessToken = val;
    localStorage.setItem('sp_token', val);
    document.getElementById('configPanel').style.display = 'none';
    addSystemMessage('🔑 Token salvo! Agora você pode fazer consultas autenticadas.');
  }

  // ============================================================
  // Renderização de mensagens
  // ============================================================
  function formatMd(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/_(.+?)_/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  function agora() {
    return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollBottom() {
    const c = document.getElementById('chatMessages');
    c.scrollTop = c.scrollHeight;
  }

  function addUserMessage(text) {
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="msg-bubble">${escapeHtml(text)}</div>
      <div class="msg-time">${agora()}</div>
    `;
    wrap.appendChild(div);
    scrollBottom();
  }

  function addBotMessage(text, sugestoes = [], intent = null) {
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg bot';

    const badgeHtml = intent && intent !== 'saudacao' && intent !== 'ajuda'
      ? `<div class="intent-badge">🎯 ${formatIntent(intent)}</div>`
      : '';

    const sugestoesHtml = sugestoes.length
      ? `<div class="suggestions">${sugestoes.map(s =>
          `<button class="suggestion-btn" onclick="usarSugestao('${escapeAttr(s)}')">${escapeHtml(s)}</button>`
        ).join('')}</div>`
      : '';

    div.innerHTML = `
      ${badgeHtml}
      <div class="msg-bubble">${formatMd(escapeHtml(text))}</div>
      ${sugestoesHtml}
      <div class="msg-time">${agora()}</div>
    `;
    wrap.appendChild(div);
    scrollBottom();
  }

  function addSystemMessage(text) {
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg system';
    div.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
    wrap.appendChild(div);
    scrollBottom();
  }

  function addTyping() {
    const wrap = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typingMsg';
    div.innerHTML = `
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    wrap.appendChild(div);
    scrollBottom();
    return div;
  }

  function removeTyping() {
    const el = document.getElementById('typingMsg');
    if (el) el.remove();
  }

  function formatIntent(intent) {
    const map = {
      consultar_cmv: 'CMV',
      consultar_estoque: 'Estoque',
      verificar_estoque_baixo: 'Estoque Baixo',
      consultar_compras: 'Compras',
      analisar_custos: 'Custos',
      consultar_vendas: 'Vendas',
      consultar_perdas: 'Perdas',
    };
    return map[intent] || intent;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return String(s).replace(/'/g, "\\'");
  }

  // ============================================================
  // Envio de mensagens
  // ============================================================
  async function enviarMensagem() {
    const input = document.getElementById('msgInput');
    const texto = input.value.trim();
    if (!texto || enviando) return;

    if (!accessToken) {
      document.getElementById('configPanel').style.display = 'block';
      addSystemMessage('⚠️ Cole seu token de acesso acima para fazer consultas.');
      return;
    }

    input.value = '';
    autoResize(input);
    enviando = true;
    document.getElementById('sendBtn').disabled = true;

    addUserMessage(texto);
    historico.push({ role: 'user', content: texto });

    const typing = addTyping();

    try {
      const res = await fetch(`${API_BASE}/chatbot`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`,
        },
        body: JSON.stringify({ mensagem: texto, historico: historico.slice(-10) }),
      });

      removeTyping();

      if (res.status === 401) {
        addSystemMessage('🔐 Token inválido ou expirado. Atualize seu token acima.');
        document.getElementById('configPanel').style.display = 'block';
        return;
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addBotMessage(`⚠️ Erro ${res.status}: ${err.detail || 'Tente novamente.'}`);
        return;
      }

      const data = await res.json();
      const resposta = data.resposta || 'Não obtive resposta do servidor.';
      const sugestoes = data.sugestoes || [];
      const intent = data.intent;

      addBotMessage(resposta, sugestoes, intent);
      historico.push({ role: 'assistant', content: resposta });

      // Limitar histórico
      if (historico.length > 20) historico = historico.slice(-20);

    } catch (err) {
      removeTyping();
      if (err.name === 'TypeError') {
        addBotMessage(
          '⚠️ Não consegui conectar ao servidor.\n\nVerifique se a API está rodando em `' + API_BASE + '`.'
        );
      } else {
        addBotMessage('⚠️ Erro inesperado: ' + err.message);
      }
    } finally {
      enviando = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('msgInput').focus();
    }
  }

  function usarSugestao(texto) {
    document.getElementById('msgInput').value = texto;
    enviarMensagem();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviarMensagem();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
</script>
</body>
</html>
