<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="api-url" content="https://stockpulse-api-1vzy.onrender.com">
<title>StockPulse — CMV Diário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&family=Fira+Mono&display=swap">
<style>
:root{color-scheme:dark;
--void:#000;--ground:#181818;--carbon:#212525;--circuit:#485346;--hair:#1f2a33;--lime:#7fee64;--phos:#ddffdc;
--sage60:#8cab87;--sage40:#677d64;--moss70:#9cbf93;--moss80:#aed2a4;--fern:#859984;--deep:#697368;--pine:#3e4a3c;--err:#e8a49a;
--goga:'Goga','Inter Tight',system-ui,sans-serif;--inter:'Inter Variable','Inter',system-ui,sans-serif;--mono:'Fira Mono',ui-monospace,monospace;
--r:8px;--rb:12px;--t:300ms ease-out;--shadow:rgba(0,0,0,.1) 0 10px 15px -3px,rgba(0,0,0,.1) 0 4px 6px -4px}
*{box-sizing:border-box;margin:0;transition:color var(--t),background-color var(--t),border-color var(--t),opacity var(--t)}
html,body{min-height:100%}
body{background:var(--void);color:var(--sage60);font:400 16px/1.5 var(--inter);letter-spacing:-.352px;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.big{font-family:var(--goga);font-weight:400;color:var(--phos);font-feature-settings:"ss01"}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.eyebrow{font-size:12px;line-height:1.33;letter-spacing:.6px;text-transform:uppercase;font-weight:500;color:var(--moss70)}
.muted{font-size:14px;line-height:1.43;letter-spacing:-.364px;color:var(--sage40)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;border-radius:9999px;padding:4px 12px;font-size:12px;font-weight:500;border:1px solid var(--circuit);color:var(--moss70)}
.tag.ok{border-color:var(--moss70);color:var(--phos)}.tag.bad{border-color:var(--err);color:var(--err)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;font-weight:500;cursor:pointer;border-radius:var(--rb);background:var(--ground);border:1px solid var(--phos);color:var(--phos)}
.btn:hover{background:var(--carbon)}.btn.accent{background:var(--lime);border-color:var(--lime);color:var(--ground);border-radius:9999px}
.btn.accent:hover{background:var(--moss80);border-color:var(--moss80)}.btn[disabled]{opacity:.5;cursor:not-allowed}.btn.block{width:100%}.btn.sm{height:40px;padding:0 16px;font-size:14px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
label.f{display:grid;gap:8px;font-size:14px;font-weight:500;color:var(--moss80)}
.input{display:flex;align-items:center;background:var(--void);border:1px solid var(--circuit);border-radius:var(--r);padding:0 16px;height:48px}
.input:hover{border-color:var(--fern)}.input:focus-within{border-color:var(--lime)}.input.invalid{border-color:var(--err)}
.input input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--phos)}.input input::placeholder{color:var(--sage40)}
.input input:-webkit-autofill,.input input:-webkit-autofill:hover,.input input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--void) inset;-webkit-text-fill-color:var(--phos);transition:background-color 5000s ease-in-out 0s}
.unit{color:var(--sage40);font-size:14px;margin-right:8px}
.err{font-size:12px;color:var(--err);font-weight:400}
.link{background:none;border:0;cursor:pointer;color:var(--fern);font-size:14px;font-weight:500}.link:hover{color:var(--phos);text-decoration:underline}
.eye{background:none;border:0;cursor:pointer;color:var(--fern);display:grid;place-items:center;padding:4px;border-radius:var(--r)}.eye:hover{color:var(--phos)}
.alert{display:flex;gap:12px;background:var(--carbon);border:1px solid var(--err);border-radius:var(--r);padding:12px 16px;font-size:14px;color:var(--err)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{appearance:none;width:18px;height:18px;border:1px solid var(--circuit);border-radius:4px;background:var(--void);display:grid;place-items:center;cursor:pointer}
.check input:checked{border-color:var(--phos);background:var(--phos)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid var(--ground);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* Auth: palco com pulso */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--void)}
.stage{position:relative;overflow:hidden;padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--hair);background:radial-gradient(ellipse 70% 50% at 30% 60%,rgba(127,238,100,.09),transparent 70%)}
.stage h1{font-size:64px;line-height:1;letter-spacing:-.448px;font-weight:500;max-width:560px}.stage h1 em{font-style:normal;color:var(--lime)}
.stage p{max-width:420px;margin-top:20px;color:var(--moss80);font-size:20px;line-height:1.5}
.stage svg{position:absolute;left:0;right:0;bottom:12%;width:100%;height:auto;opacity:.9}
.brand{display:flex;align-items:center;gap:12px;font:500 20px/1.2 var(--goga);color:var(--phos);letter-spacing:-.36px}.brand img{height:40px;width:auto}
.login{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;position:relative}
.card{width:100%;max-width:400px}
.card h2{font-size:30px;line-height:1.2;letter-spacing:-.36px;margin:8px 0}
.card form{display:grid;gap:20px;margin-top:24px}
.hint{margin-top:24px;padding-top:16px;border-top:1px solid var(--hair)}
.pl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.ring{transform-origin:center;transform-box:fill-box;animation:ping 2s ease-out infinite}@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}

/* Assinatura edcarlasousa.ai */
.sig-brand{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);letter-spacing:.4px;color:var(--fern);padding:6px 14px;border-radius:9999px;border:1px solid var(--hair);background:rgba(24,24,24,.75)}
.sig-brand i{width:6px;height:6px;border-radius:50%;background:var(--lime);display:inline-block}
.sig-brand span{color:var(--phos)}
.app-footer{max-width:1280px;margin:40px auto 0;padding:24px 32px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

/* App */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.top,main,.app-footer{position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;max-width:1280px;margin:0 auto}
.top .brand img{height:32px}
main{max-width:1280px;margin:0 auto;padding:16px 32px 140px}
.quick-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;background:rgba(24,24,24,.72);backdrop-filter:blur(12px);border:1px solid var(--hair);border-radius:var(--r);align-items:center}
.quick-bar .eyebrow{margin-right:auto}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.cell{background:rgba(24,24,24,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--hair);border-radius:var(--r);padding:32px;min-width:0}
.cell.c8{grid-column:span 8}.cell.c4{grid-column:span 4}.cell.c7{grid-column:span 7}.cell.c5{grid-column:span 5}.cell.c12{grid-column:span 12}
.cell h3{font-size:24px;line-height:1.3;letter-spacing:-.312px}
.big{font-size:64px;line-height:1;letter-spacing:-.448px;font-weight:500;display:block;margin:20px 0 8px}
.ruler{position:relative;height:56px;margin-top:28px}
.ruler .tr{position:absolute;left:0;right:0;top:28px;height:12px;background:repeating-linear-gradient(90deg,var(--circuit) 0 1px,transparent 1px 2%);border-bottom:1px solid var(--circuit)}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;gap:4px;color:var(--moss70);transition:left 600ms ease-out}
.mk::after{content:"";width:1px;height:28px;background:currentColor}
.mk.cur{color:var(--phos)}.mk.cur::after{width:2px}
.sig{display:grid;gap:12px;margin-top:20px;list-style:none;padding:0}
.sig li{display:grid;grid-template-columns:8px 1fr;gap:12px;align-items:start;padding-top:12px;border-top:1px solid var(--hair);font-size:14px;line-height:1.43}
.sig i{width:8px;height:8px;border-radius:50%;background:var(--deep);margin-top:7px}.sig i.ok{background:var(--lime)}.sig i.bad{background:var(--err)}
.sig b{display:block;color:var(--phos);font-weight:500}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
.kg .k{background:var(--carbon);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.kg .k b{font:400 30px/1.2 var(--goga);color:var(--phos);letter-spacing:-.36px}
.soon{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* Dock agrupado e intuitivo */
.dock{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:4px;padding:6px;background:rgba(33,37,37,.88);backdrop-filter:blur(12px);border:1px solid var(--circuit);border-radius:9999px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{background:none;border:1px solid transparent;border-radius:9999px;padding:9px 14px;cursor:pointer;color:var(--fern);font-size:13px;font-weight:500;white-space:nowrap}
.dock button:hover{color:var(--phos);background:rgba(255,255,255,.04)}.dock button.on{background:var(--void);border-color:var(--lime);color:var(--phos)}
.dock .sep{width:1px;height:20px;background:var(--circuit);margin:0 4px;flex-shrink:0}
.input select{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--phos)}option{background:var(--ground)}
.kr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:20px}.kr .k{background:rgba(24,24,24,.72);backdrop-filter:blur(12px);border:1px solid var(--hair);border-radius:var(--r);padding:24px}
.kr .k b{display:block;font:400 30px/1.2 var(--goga);color:var(--phos);letter-spacing:-.36px;margin-top:4px}
textarea{width:100%;height:120px;margin-top:16px;background:var(--void);border:1px solid var(--circuit);border-radius:var(--r);padding:12px;color:var(--sage60);font:12px/1.5 var(--mono);resize:vertical}
@media(max-width:600px){.kr{grid-template-columns:1fr}}
/* Fechamento */
.split{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start}
.step{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:24px 0;border-top:1px solid var(--hair)}.step:first-of-type{border-top:0;padding-top:0}
.step>span{font:500 12px/1 var(--mono);color:var(--moss70);padding-top:6px;letter-spacing:.6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.step .two,.step .one{margin-top:16px}
.term{position:sticky;top:16px;background:rgba(24,24,24,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--circuit);border-radius:16px;overflow:hidden}
.term .bar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--carbon);border-bottom:1px solid var(--hair)}
.term .bar i{width:8px;height:8px;border-radius:50%;background:var(--pine)}.term .bar span{margin-left:auto;font-size:12px;font-weight:500;color:var(--moss70)}
.term pre{font:14px/1.9 var(--mono);letter-spacing:0;padding:24px;color:var(--phos);white-space:pre-wrap}
.term pre .c{color:var(--sage40)}.term pre .k{color:var(--lime)}
.term .res{padding:0 24px 24px}
.stack{height:12px;border-radius:9999px;overflow:hidden;display:flex;gap:2px;margin-top:20px}
.stack i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th{text-align:left;font-size:12px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;color:var(--deep);padding:0 12px 12px 0}
td{padding:12px 12px 12px 0;border-top:1px solid var(--hair)}td.n{color:var(--phos)}
.tw{overflow-x:auto;margin-top:16px}
.head h2{font-size:42px;line-height:1.05;letter-spacing:-.336px;margin:8px 0 12px}.head{margin-bottom:28px}
@media(max-width:1000px){.cell.c8,.cell.c4,.cell.c7,.cell.c5{grid-column:span 12}.split{grid-template-columns:1fr}.term{position:static}}
@media(max-width:900px){#auth{grid-template-columns:1fr}.stage{min-height:320px;padding:32px 24px;border-right:0;border-bottom:1px solid var(--hair)}.stage h1{font-size:42px}.stage p{font-size:16px}.stage svg{bottom:0;opacity:.5}}
@media(max-width:600px){main{padding:8px 16px 130px}.top{padding:16px}.cell{padding:24px}.big{font-size:42px}.head h2{font-size:30px}.two{grid-template-columns:1fr}.dock button{padding:9px 12px}.kg{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.pl{stroke-dashoffset:0}}

.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--circuit);border-radius:9999px}
.seg button{background:none;border:1px solid transparent;border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--fern)}
.seg button:hover{color:var(--phos)}.seg button.on{background:var(--void);border-color:var(--circuit);color:var(--phos)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--sage40);margin:12px 0 4px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.rank{display:grid;gap:16px;margin-top:16px}.rk{display:grid;gap:8px}
.hr{display:flex;align-items:center;gap:12px}.tk{flex:1;height:8px;background:var(--pine);border-radius:9999px;overflow:hidden}
.tk i{display:block;height:100%;background:var(--moss70);border-radius:9999px;transition:width 600ms ease-out}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.tiles>div{background:var(--carbon);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column}
.tiles b{font:400 20px/1.3 var(--goga);color:var(--phos)}
input[readonly]{color:var(--moss70)}
@media(max-width:480px){.tiles{grid-template-columns:1fr}}

a.link{text-decoration:none}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.kcol{background:rgba(24,24,24,.5);border:1px solid var(--hair);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-height:120px}
.pcard{background:var(--carbon);border-radius:var(--r);padding:16px;display:grid;gap:8px}.pcard b{color:var(--phos);font-weight:500}
.phone{max-width:320px;margin:0 auto;border:1px solid var(--circuit);border-radius:25px;padding:24px 20px;background:var(--void)}
.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
@media(max-width:1000px){.kan{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kan{grid-template-columns:1fr}}

#cv{position:fixed;inset:0;z-index:30;overflow:auto;background:#000;color:var(--sage60);padding-bottom:160px}
.cvw{max-width:560px;margin:0 auto;padding:24px 20px}
.cvh{display:flex;align-items:center;gap:16px;padding:16px 0 24px;border-bottom:1px solid var(--hair)}.cvh img{height:64px;width:auto;border-radius:12px}
.cvh h1{font-size:30px;line-height:1.2;letter-spacing:-.36px}.cvh p{color:var(--sage40);font-size:14px}
#cv h2{font:500 12px/1.3 var(--inter);letter-spacing:.6px;text-transform:uppercase;color:var(--ac);margin:28px 0 4px}
.cvi{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--hair)}.cvi b{color:var(--phos);font-weight:500}.cvi p{margin:4px 0 0;font-size:14px}.cvi em{font-style:normal;color:var(--phos)}
.cvt{margin-left:8px;font-size:11px;padding:2px 8px;border-radius:9999px;background:var(--ac);color:#000}
.qty{display:flex;align-items:center;gap:12px}.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ac);background:none;color:var(--ac);font-size:18px;cursor:pointer}.qty span{min-width:16px;text-align:center;color:var(--phos)}
.cvbar{position:fixed;left:0;right:0;bottom:0;background:var(--carbon);border-top:1px solid var(--circuit);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px))}.cvbar>div{max-width:560px;margin:0 auto;display:grid;gap:12px}
.cvb{height:48px;border-radius:9999px;border:0;background:var(--ac);color:#000;font-weight:500;cursor:pointer}
.cvx{position:fixed;top:12px;right:12px;z-index:31}
#pimg{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--circuit);display:block}

#al{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;width:min(680px,calc(100vw - 24px))}
.alc{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--carbon);border:1px solid var(--lime);border-radius:var(--rb);padding:16px 20px;box-shadow:var(--shadow);animation:pop .4s ease-out}
.alc b{display:block;color:var(--phos);font-weight:500;font-size:18px}@keyframes pop{from{transform:translateY(-12px);opacity:0}}
.bdg{margin-left:6px;min-width:18px;padding:0 6px;border-radius:9999px;background:var(--lime);color:#000;font-size:11px;display:inline-block;line-height:18px}
.alert.ok{border-color:var(--moss70);color:var(--phos)}
.regras{list-style:none;padding:0;display:grid;gap:2px;font-weight:400}.regras li::before{content:"· "}.regras li.ok{color:var(--phos)}.regras li.ok::before{content:"✓ "}
</style></head><body>
