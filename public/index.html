<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="api-url" content="https://stockpulse-api-1vzy.onrender.com">
<title>StockPulse — CMV Diário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&family=Fira+Mono&display=swap">
<style>
:root{color-scheme:dark;
--void:#050505;--ground:#0A0B10;--carbon:#10121a;--circuit:#232a36;--hair:#181c26;--lime:#7fee64;--cyan:#7fee64;--cyan-deep:#7fee64;--cyan-soft:#aef79b;--phos:#f0fdf4;
--sage60:#9ca3af;--sage40:#6b7280;--moss70:#7fee64;--moss80:#d1fae5;--fern:#9ca3af;--deep:#6b7280;--pine:#181c24;--ok:#7fee64;--err:#ef4444;
--terra:#d46a4c;--terra-deep:#b85337;--terra-soft:#f0a892;
--goga:'Goga','Inter Tight',system-ui,sans-serif;--inter:'Inter Variable','Inter',system-ui,sans-serif;--mono:'Fira Mono',ui-monospace,monospace;
--r:8px;--rb:10px;--t:220ms ease-out;--shadow:rgba(0,0,0,.55) 0 10px 24px -4px}
*{box-sizing:border-box;margin:0;transition:color var(--t),background-color var(--t),border-color var(--t),opacity var(--t)}
html,body{min-height:100%}
body{background:var(--void);color:var(--sage60);font:400 14.5px/1.45 var(--inter);letter-spacing:-.25px;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.big{font-family:var(--goga);font-weight:400;color:var(--phos);font-feature-settings:"ss01"}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}
.eyebrow{font-size:11px;line-height:1.3;letter-spacing:.65px;text-transform:uppercase;font-weight:500;color:var(--lime)}
.muted{font-size:13px;line-height:1.4;letter-spacing:-.2px;color:var(--sage40)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:3px 10px;font-size:11.5px;font-weight:500;background:#11141c;border:1px solid var(--circuit);color:var(--sage60)}
.tag.ok{background:rgba(127,238,100,.12);border-color:rgba(127,238,100,.55);color:var(--lime)}.tag.bad{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.55);color:var(--err)}
.tag.terra{background:rgba(212,106,76,.18);border-color:rgba(212,106,76,.5);color:var(--terra-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:var(--rb);background:#12151e;border:1px solid #262d3d;color:var(--phos);text-decoration:none}
.btn:hover{background:#191e2b;border-color:rgba(127,238,100,.5)}.btn.accent{background:var(--lime);border-color:var(--lime);color:#050505;font-weight:600;border-radius:9999px}
.btn.accent:hover{background:#9bf584;border-color:#9bf584}.btn.terra{background:var(--terra-deep);border-color:var(--terra-deep);color:#fff;border-radius:9999px}
.btn.terra:hover{background:#9e432a;border-color:#9e432a}.btn.danger{background:#7f1d1d;border-color:#991b1b;color:#fee2e2}
.btn.danger:hover{background:#991b1b}.btn[disabled]{opacity:.48;cursor:not-allowed}.btn.block{width:100%}.btn.sm{height:34px;padding:0 14px;font-size:13px}.btn.xs{height:28px;padding:0 10px;font-size:12px;border-radius:9999px}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500;color:#d1d5db;min-width:0}
.input{display:flex;align-items:center;background:#050505;border:1px solid var(--circuit);border-radius:var(--r);padding:0 12px;height:40px;min-width:0;width:100%}
.input:hover{border-color:#3a4559}.input:focus-within{border-color:var(--lime);box-shadow:0 0 0 1px rgba(127,238,100,.25)}.input.invalid{border-color:var(--err)}
.input input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--phos)}.input input::placeholder{color:var(--sage40)}
.input input:-webkit-autofill,.input input:-webkit-autofill:hover,.input input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px #050505 inset;-webkit-text-fill-color:var(--phos);transition:background-color 5000s ease-in-out 0s}
.unit{color:var(--sage40);font-size:13px;margin-right:6px}
.err{font-size:12px;color:var(--err);font-weight:400}
.link{background:none;border:0;cursor:pointer;color:var(--lime);font-size:13px;font-weight:500}.link:hover{color:var(--phos);text-decoration:underline}
.eye{background:none;border:0;cursor:pointer;color:var(--fern);display:grid;place-items:center;padding:4px;border-radius:var(--r)}.eye:hover{color:var(--phos)}
.alert{display:flex;gap:10px;background:var(--ground);border:1px solid var(--err);border-radius:var(--r);padding:10px 14px;font-size:13.5px;color:var(--err)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;color:var(--phos)}
.check input{appearance:none;width:17px;height:17px;border:1px solid var(--circuit);border-radius:4px;background:#050505;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.check input:checked{border-color:var(--lime);background:var(--lime)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid #050505;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* Auth: palco com pulso */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--void)}
.stage{position:relative;overflow:hidden;padding:36px 40px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;border-right:1px solid var(--hair);background:radial-gradient(ellipse 75% 55% at 30% 55%,rgba(127,238,100,.08),transparent 70%)}
.stage>div{position:relative;z-index:1}
.stage h1{font-size:54px;line-height:1.02;letter-spacing:-.4px;font-weight:500;max-width:540px}.stage h1 em{font-style:normal;color:var(--lime)}
.stage p{max-width:420px;margin-top:14px;color:var(--sage60);font-size:18px;line-height:1.45}
.stage svg{position:static;display:block;width:100%;height:auto;margin-top:20px;opacity:.92;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font:500 18px/1.2 var(--goga);color:var(--phos);letter-spacing:-.3px}.brand img{height:36px;width:auto}
.login{display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:390px}
.card h2{font-size:26px;line-height:1.2;letter-spacing:-.3px;margin:6px 0}
.card form{display:grid;gap:14px;margin-top:18px}
.hint{margin-top:18px;padding-top:14px;border-top:1px solid var(--hair)}
.pl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.ring{transform-origin:center;transform-box:fill-box;animation:ping 2s ease-out infinite}@keyframes ping{from{transform:scale(1);opacity:.75}to{transform:scale(3.2);opacity:0}}

/* App compacto (#050505 + #0A0B10 glassmorphism) */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.top,main{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;max-width:1320px;margin:0 auto}
.top .brand img{height:28px}
main{max-width:1320px;margin:0 auto;padding:8px 24px 92px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.cell{background:rgba(10,11,16,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--hair);border-radius:var(--r);padding:18px;min-width:0}
.cell.c8{grid-column:span 8}.cell.c6{grid-column:span 6}.cell.c4{grid-column:span 4}.cell.c7{grid-column:span 7}.cell.c5{grid-column:span 5}.cell.c12{grid-column:span 12}
.cell h3{font-size:18px;line-height:1.25;letter-spacing:-.25px}
.big{font-size:40px;line-height:1;letter-spacing:-.4px;font-weight:500;display:block;margin:10px 0 4px}
.ruler{position:relative;height:58px;margin-top:14px}
.ruler .tr{position:absolute;left:0;right:0;top:24px;height:10px;background:repeating-linear-gradient(90deg,var(--circuit) 0 1px,transparent 1px 2%);border-bottom:1px solid var(--circuit)}
.mk{position:absolute;top:24px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;font-size:11px;gap:3px;color:var(--sage60);white-space:nowrap;transition:left 600ms ease-out}
.mk::after{content:"";width:1.5px;height:16px;background:currentColor}
.mk.cur{top:0;flex-direction:column;color:var(--lime);font-weight:600}.mk.cur::after{width:2px;height:20px}
.sig{display:grid;gap:8px;margin-top:12px;list-style:none;padding:0}
.sig li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;padding-top:8px;border-top:1px solid var(--hair);font-size:13px;line-height:1.38}
.sig i{width:8px;height:8px;border-radius:50%;background:var(--deep);margin-top:5px}.sig i.ok{background:var(--ok)}.sig i.bad{background:var(--err)}
.sig b{display:block;color:var(--phos);font-weight:500}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
.kg .k{background:rgba(16,18,26,.9);border:1px solid var(--hair);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.kg .k b{font:400 22px/1.2 var(--goga);color:var(--phos);letter-spacing:-.3px}
.soon{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* Dock */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:flex;gap:4px;padding:5px;background:rgba(10,11,16,.9);backdrop-filter:blur(10px);border:1px solid var(--circuit);border-radius:9999px;box-shadow:var(--shadow)}
.dock button{background:none;border:1px solid transparent;border-radius:9999px;padding:7px 14px;cursor:pointer;color:var(--sage60);font-size:13px;font-weight:500;white-space:nowrap}
.dock button:hover{color:var(--phos);background:rgba(127,238,100,.08)}.dock button.on{background:var(--lime);border-color:var(--lime);color:#050505;font-weight:600}
.dock{max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}.dock::-webkit-scrollbar{display:none}
.input select{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--phos)}option{background:var(--ground);color:var(--phos)}
.kr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}.kr .k{background:rgba(10,11,16,.82);backdrop-filter:blur(10px);border:1px solid var(--hair);border-radius:var(--r);padding:14px 16px}
.kr .k b{display:block;font:400 24px/1.2 var(--goga);color:var(--phos);letter-spacing:-.3px;margin-top:2px}
textarea{width:100%;height:100px;margin-top:10px;background:#050505;border:1px solid var(--circuit);border-radius:var(--r);padding:10px 12px;color:var(--phos);font:12.5px/1.45 var(--mono);resize:vertical}
@media(max-width:600px){.kr{grid-template-columns:1fr}}

/* Fechamento */
.split{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px;align-items:start}.split>*{min-width:0}
.step{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--hair)}.step:first-of-type{border-top:0;padding-top:0}
.step>span{font:500 11.5px/1 var(--mono);color:var(--lime);padding-top:5px;letter-spacing:.6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.step .two,.step .one{margin-top:10px}
.term{position:sticky;top:12px;background:rgba(10,11,16,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--circuit);border-radius:12px;overflow:hidden}
.term .bar{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--carbon);border-bottom:1px solid var(--hair)}
.term .bar i{width:8px;height:8px;border-radius:50%;background:var(--circuit)}.term .bar span{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--lime)}
.term pre{font:13px/1.75 var(--mono);letter-spacing:0;padding:16px;color:var(--phos);white-space:pre-wrap}
.term pre .c{color:var(--sage40)}.term pre .k{color:var(--lime)}
.term .res{padding:0 16px 16px}
.stack{height:10px;border-radius:9999px;overflow:hidden;display:flex;gap:2px;margin-top:12px}
.stack i{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:400px}
th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;color:var(--deep);padding:0 10px 8px 0}
td{padding:9px 10px 9px 0;border-top:1px solid var(--hair)}td.n{color:var(--phos)}
.tw{overflow-x:auto;margin-top:12px}
.head h2{font-size:28px;line-height:1.1;letter-spacing:-.3px;margin:4px 0 4px}.head{margin-bottom:14px}
@media(max-width:1000px){.cell.c8,.cell.c6,.cell.c4,.cell.c7,.cell.c5{grid-column:span 12}.split{grid-template-columns:1fr}.term{position:static}}
@media(max-width:900px){#auth{grid-template-columns:1fr}.stage{min-height:260px;padding:24px 20px;border-right:0;border-bottom:1px solid var(--hair)}.stage h1{font-size:36px}.stage p{font-size:15px}.stage svg{bottom:0;opacity:.5}}
@media(max-width:600px){main{padding:6px 14px 86px}.top{padding:10px 14px}.cell{padding:14px}.big{font-size:34px}.head h2{font-size:24px}.two{grid-template-columns:1fr}.dock button{padding:7px 11px}.kg{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.pl{stroke-dashoffset:0}}

.seg{display:inline-flex;gap:3px;padding:3px;background:var(--carbon);border:1px solid var(--circuit);border-radius:9999px}
.seg button{background:none;border:1px solid transparent;border-radius:9999px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--sage60)}
.seg button:hover{color:var(--phos)}.seg button.on{background:var(--lime);border-color:var(--lime);color:#050505;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sage60);margin:8px 0 4px}.legend span{display:inline-flex;align-items:center}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.rank{display:grid;gap:10px;margin-top:10px}.rk{display:grid;gap:6px}
.hr{display:flex;align-items:center;gap:10px}.tk{flex:1;height:7px;background:var(--pine);border-radius:9999px;overflow:hidden}
.tk i{display:block;height:100%;background:var(--lime);border-radius:9999px;transition:width 600ms ease-out}

/* Curva ABC em Grid condensado com foto e personalização */
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.abc-card{background:rgba(16,18,26,.9);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;align-content:start}
.abc-top{display:flex;align-items:center;gap:10px;min-width:0}
.abc-img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--circuit);background:#050505}
.abc-ph{width:40px;height:40px;border-radius:8px;flex-shrink:0;border:1px solid var(--circuit);background:#12151e;display:grid;place-items:center;color:var(--lime);font-size:16px}
.abc-card .abcn{color:var(--phos);font-weight:500;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abc-opts{display:flex;flex-wrap:wrap;gap:4px}
.abc-opt{font-size:10.5px;padding:2px 7px;border-radius:9999px;background:#141822;border:1px solid var(--circuit);color:var(--sage60);white-space:nowrap}
.abc-bar{height:4px;border-radius:9999px;background:var(--pine);overflow:hidden}.abc-bar i{display:block;height:100%;border-radius:9999px}

/* Multi-insumo selector */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding:8px;background:#050505;border:1px solid var(--circuit);border-radius:var(--r)}
.ins-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:var(--carbon);border:1px solid var(--hair);border-radius:6px;font-size:12.5px}
.ins-row label{display:flex;align-items:center;gap:7px;cursor:pointer;min-width:0;flex:1;color:var(--phos)}
.ins-row span.u{color:var(--sage40);font-size:11px;white-space:nowrap}
.ins-row input[type=text],.ins-row input[type=number]{width:66px;height:28px;background:#050505;border:1px solid var(--circuit);border-radius:5px;padding:0 6px;color:var(--phos);font-size:12px;text-align:right}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.tiles>div{background:rgba(16,18,26,.9);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column}
.tiles b{font:400 18px/1.3 var(--goga);color:var(--phos)}
input[readonly]{color:var(--lime)}
@media(max-width:480px){.tiles{grid-template-columns:1fr}}

@media(min-width:601px){.dock button{padding:7px 14px}}
a.link{text-decoration:none}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.kcol{background:rgba(10,11,16,.72);border:1px solid var(--hair);border-radius:var(--r);padding:12px;display:grid;gap:10px;align-content:start;min-height:110px}
.pcard{background:rgba(16,18,26,.9);border:1px solid var(--hair);border-radius:var(--r);padding:12px;display:grid;gap:6px}.pcard b{color:var(--phos);font-weight:500}
.phone{max-width:340px;margin:0 auto;border:1px solid #d1fae5;border-radius:22px;padding:18px 16px;background:#ffffff;color:#334155;box-shadow:0 10px 28px -6px rgba(34,197,94,.2)}
.phone .eyebrow{color:#15803d}.phone h3{color:#0f172a}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--hair)}
@media(max-width:1000px){.kan{grid-template-columns:1fr 1fr}}@media(max-width:600px){.kan{grid-template-columns:1fr}}

/* Cardápio Digital (#cardapio) — Fundo Branco Limpo, Sombras Verde Suave e Botões Verde Neon */
#cv{position:fixed;inset:0;z-index:30;overflow:auto;background:#ffffff;color:#334155;padding-bottom:210px}
.cvw{max-width:680px;margin:0 auto;padding:20px 18px}
.cv-banner{width:100%;height:140px;border-radius:14px;overflow:hidden;border:1px dashed #86efac;background:linear-gradient(135deg,#f0fdf4,#f8fafc);display:grid;place-items:center;margin-bottom:16px;color:#166534;font-size:13px;font-weight:500;text-align:center}
.cv-banner img{width:100%;height:100%;object-fit:cover;display:block}
.cvh{display:flex;align-items:center;gap:14px;padding:8px 0 18px;border-bottom:1px solid #e2e8f0}.cvh img{height:58px;width:58px;object-fit:cover;border-radius:12px;border:1px solid #bbf7d0}
.cvh h1{font-size:26px;line-height:1.15;letter-spacing:-.3px;color:#0f172a;font-weight:600}.cvh p{color:#475569;font-size:13.5px}
#cv h2{font:600 12px/1.3 var(--inter);letter-spacing:.7px;text-transform:uppercase;color:var(--ac2,#15803d);margin:22px 0 10px}
.cvi{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:14px;margin-bottom:12px;background:#ffffff;border:1px solid #dcfce7;border-radius:14px;box-shadow:0 8px 24px -6px rgba(34,197,94,.16),0 2px 8px -2px rgba(127,238,100,.22)}
.cvi-main{display:flex;gap:14px;flex:1;min-width:0}
.cvi-img{width:76px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid #dcfce7;background:#f8fafc}
.cvi-ph{width:76px;height:76px;border-radius:10px;flex-shrink:0;border:1px dashed #bbf7d0;background:#f0fdf4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#15803d;font-size:11px;font-weight:500}
.cvi b{color:#0f172a;font-weight:600;font-size:15.5px}.cvi p{margin:3px 0 0;font-size:14px}.cvi em{font-style:normal;color:#0f172a;font-weight:700}
.cvt{margin-left:6px;font-size:10.5px;padding:2px 8px;border-radius:9999px;background:#7fee64;color:#052e16;font-weight:600}
.cv-opts-lbl{font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.4px;margin-top:8px}
.cv-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.cv-opt{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9999px;font-size:12px;cursor:pointer;background:#f8fafc;border:1px solid #cbd5e1;color:#1e293b;font-weight:500}
.cv-opt:hover{border-color:#4ade80;background:#f0fdf4}.cv-opt.on{background:#7fee64;border-color:#22c55e;color:#052e16;font-weight:600}
.qty{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:4px}
.qty .cv-add{height:36px;padding:0 16px;border-radius:9999px;border:0;background:var(--ac,#7fee64);color:#052e16;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(127,238,100,.35)}
.qty .cv-add:hover{filter:brightness(.94)}
.qty button.qbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--ac,#7fee64);color:#052e16;font-size:17px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.qty button.qbtn:hover{background:#6be550}.qty span{min-width:18px;text-align:center;color:#0f172a;font-weight:700}
.cv-notes{margin-top:18px;padding:14px;background:#ffffff;border:1px solid #dcfce7;border-radius:14px;box-shadow:0 6px 20px -6px rgba(34,197,94,.14)}
.cv-notes label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:#0f172a}
.cv-notes textarea{margin-top:0;height:68px;background:#f8fafc;border:1px solid #cbd5e1;color:#0f172a;font-family:var(--inter);font-size:13px;padding:10px 12px;border-radius:10px}
.cv-notes textarea::placeholder{color:#64748b}
.cv-foot{margin-top:24px;padding-top:14px;border-top:1px solid #e2e8f0;text-align:center;font-size:12px;color:#64748b}
.cv-foot strong{color:#0f172a;font-weight:700}
.cvbar{position:fixed;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #dcfce7;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 28px rgba(15,23,42,.08)}
.cvbar>div{max-width:680px;margin:0 auto;display:grid;gap:8px}
.cvbar .input{background:#f8fafc;border-color:#cbd5e1;color:#0f172a;height:38px}.cvbar .input input{color:#0f172a}.cvbar .input input::placeholder{color:#64748b}
.cvb{height:44px;border-radius:9999px;border:0;background:#7fee64;color:#052e16;font-weight:700;cursor:pointer;font-size:14.5px;box-shadow:0 4px 14px rgba(127,238,100,.35)}
.cvb:hover{background:#6be550}
.cvx{position:fixed;top:12px;right:12px;z-index:31}
#pimg{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--circuit);display:block}

#al{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;width:min(680px,calc(100vw - 24px))}
.alc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ground);border:1px solid var(--lime);border-radius:var(--rb);padding:12px 16px;box-shadow:var(--shadow);animation:pop .4s ease-out}
.alc b{display:block;color:var(--phos);font-weight:500;font-size:16px}@keyframes pop{from{transform:translateY(-12px);opacity:0}}
.bdg{margin-left:5px;min-width:17px;padding:0 5px;border-radius:9999px;background:var(--lime);color:#050505;font-weight:600;font-size:11px;display:inline-block;line-height:17px}
.alert.ok{border-color:var(--ok);color:var(--ok)}
.regras{list-style:none;padding:0;display:grid;gap:2px;font-weight:400}.regras li::before{content:"· "}.regras li.ok{color:var(--phos)}.regras li.ok::before{content:"✓ "}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{s=(s||'').toString().trim();return s?parseFloat(s.replace(/\./g,'').replace(',','.')):NaN};
const pc=(c,f)=>(c/f*100).toFixed(1).replace('.',',')+'%';
/* Autenticação real: Supabase Auth, via API do StockPulse (sem contas nem senhas de demonstração) */
const API=((document.querySelector('meta[name=api-url]')||{}).content||'').trim().replace(/\/$/,'');
console.info('[StockPulse] API URL configurada:', API||'(VAZIA — defina a meta tag api-url)');
const SES={token:null,timer:null,rec:null},RK='sp_rt',PERFIL={administrador:'Administrador',gerente:'Gerente',operador:'Operador'};
const EMAILRX=/^[^@\s]{1,64}@[^@\s]{1,190}\.[^@\s.]{2,}$/,bytes=t=>encodeURIComponent(t).replace(/%[A-F\d]{2}/g,'U').length;
const REGRAS=[['10 ou mais caracteres',t=>t.length>=10],['uma letra minúscula',t=>/[a-z]/.test(t)],['uma letra maiúscula',t=>/[A-Z]/.test(t)],['um número',t=>/\d/.test(t)],['no máximo 72 caracteres',t=>bytes(t)<=72]];
const OLHO_ON='<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',OLHO_OFF='<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
const campo=(id,rot,extra='')=>`<label class="f">${rot}<div class="input"><input id="${id}" ${extra}></div><span class="err" id="${id}e"></span></label>`;
const senhaCampo=(id,rot,ac,regras)=>`<label class="f">${rot}<div class="input"><input id="${id}" type="password" autocomplete="${ac}" maxlength="128"><button type="button" class="eye" data-for="${id}" aria-label="Mostrar senha"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${OLHO_ON}</svg></button></div><span class="err" id="${id}e"></span>${regras?`<ul class="regras muted" id="${id}r">${REGRAS.map(r=>`<li>${r[0]}</li>`).join('')}</ul>`:''}</label>`;
const botao=(id,txt)=>`<button class="btn accent block" id="${id}" type="submit" data-t="${txt}"><span>${txt}</span></button>`;
function montarAuth(){$('aCard').innerHTML=`<div class="alert" id="aMsg" role="status" aria-live="polite" hidden style="margin-bottom:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg><span id="aMsgT"></span></div>
<div id="vLogin"><div class="eyebrow">Acesso restrito</div><h2>Entre na sua conta</h2><p class="muted">Use o e-mail e a senha do seu cadastro.</p>
 <form id="fLogin" novalidate>${campo('aLe','E-mail','type="email" autocomplete="username" inputmode="email" placeholder="voce@suaempresa.com.br"')}${senhaCampo('aLs','Senha','current-password')}
 <div class="row"><label class="check"><input type="checkbox" id="aLr"> Manter conectado</label><button type="button" class="link" data-go="rec">Esqueci minha senha</button></div>${botao('aLb','Entrar')}</form>
 <p class="hint muted">Ainda não tem conta? <button type="button" class="link" data-go="cad">Criar conta</button></p></div>
<div id="vCad" hidden><div class="eyebrow">Novo cadastro</div><h2>Crie sua conta</h2><p class="muted">Você será o administrador do seu estabelecimento.</p>
 <form id="fCad" novalidate>${campo('aCn','Nome completo','autocomplete="name" maxlength="80"')}${campo('aCe','E-mail','type="email" autocomplete="email" inputmode="email"')}${campo('aCneg','Nome do estabelecimento (opcional)','maxlength="80" autocomplete="organization"')}
 <label class="f">Tipo de negócio<div class="input"><select id="aCt"><option value="">Selecione</option><option value="hamburgueria">Hamburgueria</option><option value="restaurante">Restaurante</option><option value="acai">Açaiteria</option><option value="bar">Bar</option><option value="pizzaria">Pizzaria</option><option value="outro">Outro</option></select></div></label>
 ${senhaCampo('aCs','Senha','new-password',1)}${senhaCampo('aCc','Confirmar senha','new-password')}${botao('aCb','Criar conta')}</form>
 <p class="hint muted">Já tem conta? <button type="button" class="link" data-go="login">Entrar</button></p></div>
<div id="vRec" hidden><div class="eyebrow">Recuperar acesso</div><h2>Esqueci minha senha</h2><p class="muted">Informe seu e-mail e enviaremos as instruções.</p>
 <form id="fRec" novalidate>${campo('aRe','E-mail','type="email" autocomplete="email" inputmode="email"')}${botao('aRb','Enviar instruções')}</form>
 <p class="hint muted"><button type="button" class="link" data-go="login">Voltar para o login</button></p></div>
<div id="vRed" hidden><div class="eyebrow">Recuperar acesso</div><h2>Crie uma nova senha</h2><p class="muted">Escolha uma senha forte que você ainda não usou.</p>
 <form id="fRed" novalidate>${senhaCampo('aNs','Nova senha','new-password',1)}${senhaCampo('aNc','Confirmar nova senha','new-password')}${botao('aNb','Salvar nova senha')}</form></div>
<div id="vCarga" hidden><div class="eyebrow">Acesso restrito</div><h2>Verificando sua sessão</h2><p class="muted" style="display:flex;gap:12px;align-items:center"><span class="spin"></span> Aguarde um instante…</p></div>`;
 try{const u=localStorage.getItem('sp_user');if(u){$('aLe').value=u;$('aLr').checked=true}}catch(e){}
 $('aCard').addEventListener('click',e=>{const b=e.target.closest('.eye');if(b){const i=$(b.dataset.for),m=i.type==='password';i.type=m?'text':'password';b.setAttribute('aria-label',m?'Ocultar senha':'Mostrar senha');b.querySelector('svg').innerHTML=m?OLHO_OFF:OLHO_ON;return}const g=e.target.closest('[data-go]');if(g)mostrar(g.dataset.go)});
 $('fLogin').onsubmit=entrar;$('fCad').onsubmit=cadastrar;$('fRec').onsubmit=recuperarSenha;$('fRed').onsubmit=redefinir;
 [['aCs'],['aNs']].forEach(([i])=>$(i).oninput=()=>regras(i))}
function regras(id){const v=$(id).value;[...$(id+'r').children].forEach((li,i)=>li.className=REGRAS[i][1](v)?'ok':'')}
function mostrar(v,manter){['Login','Cad','Rec','Red','Carga'].forEach(x=>$('v'+x).hidden=x.toLowerCase()!==v);if(!manter)aviso('',''); $('aCard').querySelectorAll('.err').forEach(x=>x.textContent='');$('aCard').querySelectorAll('.input.invalid').forEach(x=>x.classList.remove('invalid'));
 const f=$('v'+v[0].toUpperCase()+v.slice(1)).querySelector('input,select');if(f&&v!=='carga'&&f.focus)f.focus()}
function aviso(t,m){const a=$('aMsg');if(!a)return;a.hidden=!m;a.className='alert'+(t==='ok'?' ok':'');$('aMsgT').textContent=m||''}
function erroCampo(id,m){$(id+'e').textContent=m||'';$(id).closest('.input').classList.toggle('invalid',!!m);return !!m}
function ocupado(id,on,txt){const b=$(id);b.disabled=on;b.innerHTML=on?'<span class="spin"></span><span>'+txt+'</span>':'<span>'+b.dataset.t+'</span>'}
const txt=(d,f)=>{const x=d&&d.detail;if(typeof x==='string')return x;if(Array.isArray(x)&&x.length)return x.map(i=>String(i.msg||'').replace(/^Value error, /,'')).filter(Boolean).join(' ')||f;return f};
async function api(caminho,{metodo='POST',corpo,token}={}){
 if(!API)throw{status:0,msg:'O servidor ainda não foi configurado: defina o endereço da API na página.'};
 let r;try{r=await fetch(API+caminho,{method:metodo,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:corpo?JSON.stringify(corpo):undefined})}catch(e){console.error('[StockPulse] Falha de rede ao chamar '+API+caminho+':', e);const isCors=e instanceof TypeError&&(e.message||'').toLowerCase().includes('cors');throw{status:0,msg:isCors?'O servidor bloqueou a requisição (CORS). Verifique se o endereço da API está correto e se o CORS está configurado.':'Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente. (URL: '+API+caminho+')'}}
 let d=null;try{d=await r.json()}catch(e){}if(r.ok)return d;const st=r.status;let m;
 if(st===429){const sg=+(r.headers&&r.headers.get&&r.headers.get('Retry-After'))||0;m='Muitas tentativas. '+(sg?'Tente novamente em '+Math.max(1,Math.ceil(sg/60))+' min.':'Aguarde alguns minutos.')}
 else if(st>=500){console.error('[StockPulse] Erro '+st+' em '+caminho+':', d);m='Serviço temporariamente indisponível. Tente novamente em instantes.';}
 else{console.warn('[StockPulse] Erro '+st+' em '+caminho+':', d);m=txt(d,'Não foi possível concluir. Tente novamente.');}
 throw{status:st,msg:m}}
const guardado=()=>localStorage.getItem(RK)!==null?localStorage:sessionStorage;
function iniciar(d,lembrar){const st=lembrar===undefined?guardado():(lembrar?localStorage:sessionStorage);localStorage.removeItem(RK);sessionStorage.removeItem(RK);if(d.refresh_token)st.setItem(RK,d.refresh_token);
 SES.token=d.access_token;clearTimeout(SES.timer);SES.timer=setTimeout(renovar,Math.max(30,(d.expires_in||3600)-60)*1000);
 ROLE=PERFIL[d.usuario.perfil]||'Operador';USER=d.usuario.nome;
 $('aLs').value='';$('auth').hidden=true;$('app').hidden=false;$('dt').textContent=S.estab+' · '+ROLE+' · '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});go('dash');if(typeof renderAl==='function')renderAl()}
async function renovar(){const rt=localStorage.getItem(RK)||sessionStorage.getItem(RK);if(!rt)return limparSessao('Sua sessão expirou. Entre novamente.');
 try{iniciar(await api('/auth/renovar',{corpo:{refresh_token:rt}}))}catch(x){if(x.status===401)limparSessao('Sua sessão expirou. Entre novamente.');else SES.timer=setTimeout(renovar,30000)}}
function limparSessao(msg){clearTimeout(SES.timer);SES.token=null;SES.rec=null;localStorage.removeItem(RK);sessionStorage.removeItem(RK);ROLE='Operador';USER='';

(()=>{const cv=$('bg'),c=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,D,pts=[],tris=[];
 const initMesh=()=>{pts=[];tris=[];const cols=7,rows=7,mw=W*.58,cw=mw/(cols-1),rh=H/(rows-1);
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const bx=col*cw,by=r*rh,jx=(Math.sin(r*7.3+col*3.1)*.38)*cw,jy=(Math.cos(col*5.7+r*2.9)*.38)*rh;
   pts.push({bx:bx+jx,by:by+jy,ph:r*1.3+col*.9,sp:.00018+((r+col)%3)*.00005})}
  for(let r=0;r<rows-1;r++)for(let col=0;col<cols-1;col++){const a=r*cols+col,b=a+1,d=a+cols,e=d+1;tris.push([a,b,d],[b,e,d])}};
 const rs=()=>{D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);initMesh()};rs();addEventListener('resize',rs);
 function draw(t){c.clearRect(0,0,W,H);
  const g=c.createRadialGradient(W*.18,H*.38,0,W*.18,H*.38,Math.max(W,H)*.45);g.addColorStop(0,'rgba(127,238,100,.065)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);
  const P=pts.map(p=>[p.bx+Math.sin(t*p.sp+p.ph)*14,p.by+Math.cos(t*p.sp*.85+p.ph)*12]);
  c.save();c.beginPath();c.rect(0,0,W*.6,H);c.clip();
  tris.forEach(([i,j,k],idx)=>{const p1=P[i],p2=P[j],p3=P[k],cx=(p1[0]+p2[0]+p3[0])/3,fade=Math.max(0,1-cx/(W*.56));if(fade<=.01)return;
   c.beginPath();c.moveTo(p1[0],p1[1]);c.lineTo(p2[0],p2[1]);c.lineTo(p3[0],p3[1]);c.closePath();
   if(idx%5===0){c.fillStyle=`rgba(127,238,100,${(.022*fade).toFixed(4)})`;c.fill()}
   c.strokeStyle=`rgba(127,238,100,${(.11*fade).toFixed(4)})`;c.lineWidth=.8;c.stroke()});
  P.forEach(([px,py])=>{const fade=Math.max(0,1-px/(W*.56));if(fade<=.02)return;c.fillStyle=`rgba(127,238,100,${(.28*fade).toFixed(3)})`;c.beginPath();c.arc(px,py,1.6,0,6.283);c.fill()});
  c.restore()}
